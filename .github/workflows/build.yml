name: My Test Single Project
on:
  push:
    branches:
    - main
    - qa
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
  worflow_dispatch:
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: SonarQubeScan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN : ${{secrets.SONAR_TOKEN}}